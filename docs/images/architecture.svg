<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="420" fill="#f7f8fc"/>
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1d2433">ShoppingLog 部署结构（对外只有一个端口：8088）</text>

  <!-- 客户端 -->
  <g>
    <rect x="24" y="70" width="180" height="70" rx="12" fill="#ffffff" stroke="#d8dcea"/>
    <text x="114" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2433">浏览器</text>
    <text x="114" y="118" text-anchor="middle" font-size="11" fill="#6b7488">我的记录 / 公开广场</text>
  </g>
  <g>
    <rect x="24" y="160" width="180" height="70" rx="12" fill="#ffffff" stroke="#d8dcea"/>
    <text x="114" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2433">AI 客户端 / skill</text>
    <text x="114" y="208" text-anchor="middle" font-size="11" fill="#6b7488">MCP（Bearer Token）</text>
  </g>
  <g>
    <rect x="24" y="250" width="180" height="70" rx="12" fill="#ffffff" stroke="#d8dcea"/>
    <text x="114" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2433">命令行 shop.py</text>
    <text x="114" y="298" text-anchor="middle" font-size="11" fill="#6b7488">--api --token</text>
  </g>

  <!-- 箭头：客户端 -> 8088 -->
  <g stroke="#8a94ad" fill="none" stroke-width="1.6">
    <path d="M204 105 H262"/>
    <path d="M204 195 H262"/>
    <path d="M204 285 H262"/>
  </g>
  <g fill="#8a94ad">
    <path d="M262 105 l-7 -4 v8 z"/>
    <path d="M262 195 l-7 -4 v8 z"/>
    <path d="M262 285 l-7 -4 v8 z"/>
  </g>

  <!-- nginx 8088 -->
  <rect x="266" y="150" width="170" height="100" rx="14" fill="#eef1ff" stroke="#5b6cff" stroke-width="1.6"/>
  <text x="351" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#3d4bcc">nginx :8088</text>
  <text x="351" y="206" text-anchor="middle" font-size="11" fill="#4a5490">静态页面 + /api/* 反代</text>
  <text x="351" y="224" text-anchor="middle" font-size="11" fill="#4a5490">/api/mcp 单独放行</text>
  <text x="351" y="242" text-anchor="middle" font-size="11" fill="#4a5490">透传 Authorization</text>

  <g stroke="#8a94ad" fill="none" stroke-width="1.6"><path d="M436 200 H500"/></g>
  <g fill="#8a94ad"><path d="M500 200 l-7 -4 v8 z"/></g>

  <!-- python 服务 -->
  <rect x="504" y="110" width="200" height="180" rx="14" fill="#ffffff" stroke="#d8dcea"/>
  <text x="604" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2433">Python 服务 :8787</text>
  <text x="604" y="162" text-anchor="middle" font-size="11" fill="#6b7488">仅本机可达，不对外</text>
  <g font-size="11" fill="#4a5568">
    <text x="524" y="188">· HTTP API  /api/*</text>
    <text x="524" y="208">· MCP       /api/mcp</text>
    <text x="524" y="228">· 本地 OCR（macOS Vision）</text>
    <text x="524" y="248">· 健康评分（纯规则）</text>
    <text x="524" y="268">· 图片归档 images/YYYY-MM/</text>
  </g>

  <g stroke="#8a94ad" fill="none" stroke-width="1.6"><path d="M704 200 H760"/></g>
  <g fill="#8a94ad"><path d="M760 200 l-7 -4 v8 z"/></g>

  <!-- 数据层 -->
  <rect x="764" y="120" width="112" height="80" rx="12" fill="#eafaf1" stroke="#22a06b"/>
  <text x="820" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#12734c">items</text>
  <text x="820" y="170" text-anchor="middle" font-size="11" fill="#3f7a5e">商品档案</text>
  <text x="820" y="186" text-anchor="middle" font-size="11" fill="#3f7a5e">+ 品类扩展表</text>

  <rect x="764" y="212" width="112" height="80" rx="12" fill="#fff6ec" stroke="#e8935a"/>
  <text x="820" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#a35f24">purchases</text>
  <text x="820" y="262" text-anchor="middle" font-size="11" fill="#a35f24">购买记录</text>
  <text x="820" y="278" text-anchor="middle" font-size="11" fill="#a35f24">一次购买一行</text>

  <text x="820" y="316" text-anchor="middle" font-size="11" fill="#6b7488">SQLite / MySQL</text>

  <!-- 底部说明 -->
  <rect x="24" y="342" width="852" height="56" rx="12" fill="#ffffff" stroke="#d8dcea"/>
  <text x="44" y="366" font-size="12" fill="#4a5568">域名只转发 8088：前端页面与 MCP 都挂在这一端口上；后端 8787 只监听 127.0.0.1，域名直接访问不到，也不需要。</text>
  <text x="44" y="386" font-size="12" fill="#4a5568">判据：<tspan font-family="monospace">curl -s https://&lt;域名&gt;/api/version</tspan> 与仓库根 VERSION 文件一致，说明线上就是这个版本。</text>
</svg>
