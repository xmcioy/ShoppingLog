<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="300" fill="#f7f8fc"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1d2433">传图录入：两步走（或「再买一次」一步搞定）</text>

  <!-- Step 1 -->
  <rect x="24" y="58" width="250" height="180" rx="14" fill="#ffffff" stroke="#5b6cff" stroke-width="1.6"/>
  <circle cx="60" cy="92" r="14" fill="#5b6cff"/>
  <text x="60" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="84" y="97" font-size="14" font-weight="700" fill="#1d2433">传图（可多选 / 拖拽）</text>
  <rect x="48" y="112" width="202" height="72" rx="10" fill="#f2f4ff" stroke="#c9cffb" stroke-dasharray="5 4"/>
  <text x="149" y="136" text-anchor="middle" font-size="20">📷</text>
  <text x="149" y="156" text-anchor="middle" font-size="11" fill="#4a5490">点击选择，或拖到这里</text>
  <text x="149" y="172" text-anchor="middle" font-size="11" fill="#6b7488">订单截图 / 包装 / 成分表</text>
  <text x="48" y="204" font-size="11" fill="#6b7488">图片立即归档 → 自动本地识别</text>
  <text x="48" y="222" font-size="11" fill="#6b7488">（macOS Vision，不联网）</text>

  <!-- arrow -->
  <g stroke="#8a94ad" fill="none" stroke-width="1.8"><path d="M280 148 H322"/></g>
  <g fill="#8a94ad"><path d="M322 148 l-8 -5 v10 z"/></g>

  <!-- Step 2 -->
  <rect x="326" y="58" width="290" height="180" rx="14" fill="#ffffff" stroke="#22a06b" stroke-width="1.6"/>
  <circle cx="362" cy="92" r="14" fill="#22a06b"/>
  <text x="362" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="386" y="97" font-size="14" font-weight="700" fill="#1d2433">核对并补全</text>
  <g font-size="11" fill="#4a5568">
    <rect x="350" y="112" width="120" height="26" rx="7" fill="#eafaf1" stroke="#bfe5cf"/>
    <text x="362" y="129">名称  已识别</text>
    <rect x="480" y="112" width="120" height="26" rx="7" fill="#eafaf1" stroke="#bfe5cf"/>
    <text x="492" y="129">价格  已识别</text>
    <rect x="350" y="146" width="120" height="26" rx="7" fill="#eafaf1" stroke="#bfe5cf"/>
    <text x="362" y="163">品牌  已识别</text>
    <rect x="480" y="146" width="120" height="26" rx="7" fill="#fff6ec" stroke="#f0d3b6"/>
    <text x="492" y="163">渠道  待补</text>
    <rect x="350" y="180" width="250" height="26" rx="7" fill="#f4f5f9" stroke="#dfe2ec"/>
    <text x="362" y="197">评价 / 分享范围  自己填</text>
  </g>
  <text x="350" y="224" font-size="11" fill="#6b7488">识别到的标绿，缺哪补哪</text>

  <!-- arrow -->
  <g stroke="#8a94ad" fill="none" stroke-width="1.8"><path d="M622 148 H664"/></g>
  <g fill="#8a94ad"><path d="M664 148 l-8 -5 v10 z"/></g>

  <!-- Save -->
  <rect x="668" y="88" width="208" height="120" rx="14" fill="#eef1ff" stroke="#5b6cff" stroke-width="1.6"/>
  <text x="772" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#3d4bcc">保存</text>
  <text x="772" y="144" text-anchor="middle" font-size="11" fill="#4a5490">商品档案 1 条</text>
  <text x="772" y="164" text-anchor="middle" font-size="11" fill="#4a5490">购买记录 1 条</text>
  <text x="772" y="188" text-anchor="middle" font-size="11" fill="#6b7488">健康评分随记录保存</text>

  <!-- reuse branch -->
  <rect x="24" y="252" width="852" height="34" rx="10" fill="#fff6ec" stroke="#e8935a"/>
  <text x="44" y="274" font-size="12" fill="#a35f24">买过的东西：弹窗上方搜商品名 →「再买一次」（或卡片上点 🛒）→ 只填本次价格 / 日期 / 数量 / 渠道 → 保存后商品档案不重复建，只在购买记录里多一行。</text>
</svg>
