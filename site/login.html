<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · ShoppingLog</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .card {
    background: #fff; border-radius: 14px; padding: 40px 36px; width: 340px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .card h1 { font-size: 20px; color: #333; margin-bottom: 6px; }
  .card p  { font-size: 13px; color: #999; margin-bottom: 26px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .field input {
    width: 100%; height: 42px; padding: 0 12px; font-size: 14px;
    border: 1px solid #d9d9d9; border-radius: 8px; outline: none;
    transition: border-color .2s;
  }
  .field input:focus { border-color: #667eea; }
  button {
    width: 100%; height: 44px; margin-top: 6px; border: 0; border-radius: 8px;
    background: #667eea; color: #fff; font-size: 15px; cursor: pointer;
    transition: opacity .2s;
  }
  button:hover { opacity: .88; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .err { color: #e53935; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
  .alt { text-align: center; margin-top: 18px; font-size: 13px; color: #999; }
  .alt a { color: #667eea; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1>ShoppingLog</h1>
    <p>请输入用户名和密码登录</p>
    <form id="f" novalidate>
      <div class="field">
        <label>用户名</label>
        <input type="text" id="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submitBtn">登 录</button>
    </form>
    <div class="err" id="err"></div>
    <div class="alt">还没有账号？<a href="/register.html">注册</a></div>
  </div>
  <script>
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      var btn = document.getElementById("submitBtn");
      err.textContent = "";
      btn.disabled = true; btn.textContent = "登录中…";
      fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value
        })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.ok) { location.href = "/"; }
        else { err.textContent = d.error || "用户名或密码错误"; btn.disabled = false; btn.textContent = "登 录"; }
      }).catch(function () {
        err.textContent = "登录服务未运行，请确认服务已启动";
        btn.disabled = false; btn.textContent = "登 录";
      });
    });
  </script>
</body>
</html>
