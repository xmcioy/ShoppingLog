<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · ShoppingLog</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .card {
    background: #fff; border-radius: 14px; padding: 40px 36px; width: 340px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .card h1 { font-size: 20px; color: #333; margin-bottom: 6px; }
  .card p  { font-size: 13px; color: #999; margin-bottom: 26px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .field input {
    width: 100%; height: 42px; padding: 0 12px; font-size: 14px;
    border: 1px solid #d9d9d9; border-radius: 8px; outline: none;
    transition: border-color .2s;
  }
  .field input:focus { border-color: #667eea; }
  button {
    width: 100%; height: 44px; margin-top: 6px; border: 0; border-radius: 8px;
    background: #667eea; color: #fff; font-size: 15px; cursor: pointer;
    transition: opacity .2s;
  }
  button:hover { opacity: .88; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .err { color: #e53935; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
  .alt { text-align: center; margin-top: 18px; font-size: 13px; color: #999; }
  .alt a { color: #667eea; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1>注册账号</h1>
    <p>注册后即可拥有独立购物记录空间</p>
    <form id="f" novalidate>
      <div class="field">
        <label>用户名</label>
        <input type="text" id="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label>确认密码</label>
        <input type="password" id="password2" autocomplete="new-password" required>
      </div>
      <button type="submit" id="submitBtn">注 册</button>
    </form>
    <div class="err" id="err"></div>
    <div class="alt">已有账号？<a href="/login.html">去登录</a></div>
  </div>
  <script>
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      var btn = document.getElementById("submitBtn");
      err.textContent = "";
      var u = document.getElementById("username").value.trim();
      var p = document.getElementById("password").value;
      var p2 = document.getElementById("password2").value;
      if (!u) { err.textContent = "请填写用户名"; return; }
      if (p.length < 6) { err.textContent = "密码至少 6 位"; return; }
      if (p !== p2) { err.textContent = "两次密码不一致"; return; }
      btn.disabled = true; btn.textContent = "注册中…";
      fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.ok) {
          err.style.color = "#22a06b";
          err.textContent = "注册成功，正在跳转…";
          location.href = "/login.html?registered=1";
        } else {
          err.style.color = "#e53935";
          err.textContent = d.error || "注册失败";
          btn.disabled = false; btn.textContent = "注 册";
        }
      }).catch(function () {
        err.textContent = "注册服务未运行，请确认服务已启动";
        btn.disabled = false; btn.textContent = "注 册";
      });
    });
  </script>
</body>
</html>
